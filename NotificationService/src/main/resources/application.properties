spring.application.name=NotificationService
server.port=8083

# REST
spring.mvc.problemdetails.enabled=true
spring.threads.virtual.enabled=true

# MongoDB (overridden by SPRING_MONGODB_URI in containers and by @ServiceConnection in tests)
spring.mongodb.uri=mongodb://notification:notification@localhost:27017/notifications?authSource=notifications

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.username=todo
spring.rabbitmq.password=todo
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.prefetch=10

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
