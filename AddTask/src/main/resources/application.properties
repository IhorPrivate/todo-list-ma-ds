spring.application.name=AddTask
server.port=8082

# REST
spring.mvc.problemdetails.enabled=true
spring.threads.virtual.enabled=true
springdoc.paths-to-match=/api/**

# MongoDB: database owned by this service
spring.mongodb.uri=mongodb://addtask:addtask@localhost:27017/tasks?authSource=tasks

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.username=todo
spring.rabbitmq.password=todo
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.prefetch=10

# Outbox relay: publishes events stored with each task write
outbox.relay.interval-ms=500
outbox.relay.batch-size=50
outbox.relay.confirm-timeout-ms=5000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
